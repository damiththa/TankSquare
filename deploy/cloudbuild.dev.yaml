# Google Cloud Build - TankSquare DEV Environment (`dev` branch)
# Secrets are referenced from Google Cloud Secret Manager via `--set-secrets` (never hardcoded).
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/tanksquare/api-dev:$COMMIT_SHA'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/tanksquare/api-dev:$COMMIT_SHA'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tanksquare-api-dev'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/tanksquare/api-dev:$COMMIT_SHA'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=ENV=dev,GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_COLLECTION_PREFIX=dev_,GCS_BUCKET_NAME=${PROJECT_ID}-media,USE_GCP_SECRET_MANAGER=true,SEED_DEMO_DATA=true'
      - '--set-secrets=GOOGLE_MAPS_API_KEY=tanksquare-google-maps-api-key:latest,W3W_API_KEY=tanksquare-w3w-api-key:latest,SESSION_SIGNING_SECRET=tanksquare-session-signing-secret:latest,VENDOR_API_SHARED_SECRET=tanksquare-vendor-api-secret:latest'

substitutions:
  _REGION: us-central1

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/tanksquare/api-dev:$COMMIT_SHA'
