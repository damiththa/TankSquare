# Google Cloud Build - TankSquare PROD Environment (`main` branch)
# Uses `:latest` tag so Artifact Registry overwrites in-place and stays under the 500 MB Free Tier.
steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/tanksquare/api-prod:${_TAG}'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/tanksquare/api-prod:${_TAG}'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'tanksquare-api-prod'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/tanksquare/api-prod:${_TAG}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--set-env-vars=ENV=prod,GCP_PROJECT_ID=$PROJECT_ID,FIRESTORE_COLLECTION_PREFIX=prod_,GCS_BUCKET_NAME=${PROJECT_ID}-media,USE_GCP_SECRET_MANAGER=true,REQUIRE_VENDOR_API_KEY=true,SEED_DEMO_DATA=false'
      - '--set-secrets=GOOGLE_MAPS_API_KEY=tanksquare-google-maps-api-key:latest,W3W_API_KEY=tanksquare-w3w-api-key:latest,SESSION_SIGNING_SECRET=tanksquare-session-signing-secret:latest,VENDOR_API_SHARED_SECRET=tanksquare-vendor-api-secret:latest'

substitutions:
  _REGION: us-central1
  _TAG: latest

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/tanksquare/api-prod:${_TAG}'
