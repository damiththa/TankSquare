name: Deploy TankSquare to Google Cloud Run (DEV & PROD)

on:
  push:
    branches:
      - dev
      - main

jobs:
  test:
    name: Run FastAPI & Grid Math Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Pytest Suite
        run: pytest -v

  deploy-dev:
    name: Deploy to GCP Cloud Run (DEV)
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_DEV }}
      - name: Deploy TankSquare DEV to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: tanksquare-api-dev
          region: us-central1
          source: .
          env_vars: |
            ENV=dev
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID_DEV }}
            FIRESTORE_COLLECTION_PREFIX=dev_
            GCS_BUCKET_NAME=${{ secrets.GCP_PROJECT_ID_DEV }}-media
            SEED_DEMO_DATA=true

  deploy-prod:
    name: Deploy to GCP Cloud Run (PROD)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_PROD }}
      - name: Deploy TankSquare PROD to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: tanksquare-api-prod
          region: us-central1
          source: .
          env_vars: |
            ENV=prod
            GCP_PROJECT_ID=${{ secrets.GCP_PROJECT_ID_PROD }}
            FIRESTORE_COLLECTION_PREFIX=prod_
            GCS_BUCKET_NAME=${{ secrets.GCP_PROJECT_ID_PROD }}-media
            REQUIRE_VENDOR_API_KEY=true
            SEED_DEMO_DATA=false
