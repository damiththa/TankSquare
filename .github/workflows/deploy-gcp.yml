name: Deploy TankSquare to Google Cloud Run (Single GCP Project - DEV & PROD Isolated)

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID || 'tanksquare' }}
  REGION: ${{ vars.GCP_REGION || 'us-central1' }}

jobs:
  test:
    name: Run FastAPI & Grid Math Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Dependencies
        run: pip install -r requirements.txt
      - name: Run Pytest Suite
        run: python -m pytest -v

  deploy-dev:
    name: Deploy to GCP Cloud Run (DEV - tanksquare-api-dev)
    needs: test
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Build & Deploy TankSquare DEV via Cloud Build
        run: |
          gcloud builds submit --config deploy/cloudbuild.dev.yaml --project "${{ env.PROJECT_ID }}"

  deploy-prod:
    name: Deploy to GCP Cloud Run (PROD - tanksquare-api-prod)
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Build & Deploy TankSquare PROD via Cloud Build
        run: |
          gcloud builds submit --config deploy/cloudbuild.prod.yaml --project "${{ env.PROJECT_ID }}"
